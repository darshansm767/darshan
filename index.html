
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login & Registration</title>
  <script src="https://kit.fontawesome.com/face484ba1.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Basic reset */
    * {
        margin: 2px;
        padding: 10px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    /* Loader styling */
    .loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 8px solid #e0e0e0;
        border-top: 8px solid #007BFF;
        border-radius: 30%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        z-index: 9999;
        display: none;
    }
    @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    /* Overall container styling */
    .login-container {
        width: 780px;
        margin: 30px auto;
        background: #9fb38b;
        border: 1px solid #ddd;
        display: flex;
        border-radius: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        overflow: hidden;
        transition: all 0.5s ease;
    }
    /* Social Media Section (Left Side) */
    .social-container {
        width: 280px;
        background: #11508ba8;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
    }
    .social-container h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #000;
    }
    .social-logos {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .social-item {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .social-item i {
        font-size: 24px;
        color: white;
    }
    .social-item span {
        font-size: 18px;
        color: #212529;
    }
    /* Form Section (Right Side) */
    .form-wrapper {
        width: 60%;
        padding: 30px;
    }
    .logo {
        text-align: center;
        margin-bottom: 10px;
    }
    .logo img {
        max-width: 300px;
        max-height: 200px;
    }
    /* Form styling */
    .form {
        display: flex;
        flex-direction: column;
    }
    .form h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #212529;
    }
    .form input, 
    .form select {
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 5px;
        transition: border 0.3s ease;
    }
    .form input:focus, 
    .form select:focus {
        border-color: #80bdff;
        outline: none;
    }
    .form button {
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: red;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.1s ease;
        position: relative;
    }
    .form button:hover {
        background-color: #000;
    }
    /* Hidden elements */
    .hidden {
        display: none;
    }
    .toggle {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
        color: #578ebe;
    }
    .toggle a {
        color: #007BFF;
        text-decoration: none;
    }
    .radio-group {
        background: #fff;
        border: 1px solid #fff;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
    }
    .radio-group label {
        margin-right: 10px;
    }
    /* Fast moving button animation */
    .move-button {
        animation: moveBtn 0.1s ease forwards;
    }
    @keyframes moveBtn {
        0% { transform: translateX(0); }
        100% { transform: translateX(150px); }
    }
    /* Namaste Card Styles */
    .namaste-card {
        background: #fff5e6;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
        position: relative;
        overflow: hidden;
        border: 3px solid #ff9933;
        margin-bottom: 20px;
    }
    .namaste-icon {
        width: 120px;
        height: 120px;
        background: #ff9933;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: float 3s ease-in-out infinite;
    }
    .namaste-icon img {
        width: 150px;
        height: 150px;
    }
    .namaste-text {
        font-family: 'Arial Rounded MT Bold', sans-serif;
        color: #2c3e50;
        font-size: 1.8em;
        margin-bottom: 15px;
    }
    .school-motto {
        color: #666;
        font-style: italic;
        margin-bottom: 25px;
    }
    .cultural-border {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 15px;
        background: repeating-linear-gradient(
            45deg,
            #ff9933,
            #ff9933 10px,
            #138808 10px,
            #138808 20px
        );
    }
    .decorative-elements {
        position: absolute;
        top: 10px;
        right: 10px;
        opacity: 0.1;
    }
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }
    .welcome-container {
        max-width: 800px;
        margin: 50px auto;
        position: relative;
        z-index: 1;
    }
    /* Adjust overall alignment */
    body {
        background: url('login.jpg') no-repeat center center fixed;
        background-size: cover;
    }
  </style>
</head>

            </label>

                <input type="radio" name="gender" value="other"> Other
            </label>

        <p class="toggle">Already have an account? <a href="#" id="showLogin">Sign In here</a></p>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const showRegisterLink = document.getElementById('showRegister');
    const showLoginLink = document.getElementById('showLogin');
    const loader = document.getElementById('loader');
    const loginButton = document.getElementById('loginBtn');

    // Function to show the loader
    function showLoader() {
      loader.style.display = 'block';
    }

    // Function to hide the loader
    function hideLoader() {
      loader.style.display = 'none';
    }

    if (showRegisterLink) {
      showRegisterLink.addEventListener('click', function(e) {
        e.preventDefault();
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
      });
    }

    if (showLoginLink) {
      showLoginLink.addEventListener('click', function(e) {
        e.preventDefault();
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
      });
    }

    if (loginForm) {
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent the default form submission

        // Basic client-side validation (you should also have server-side validation)
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
          alert('Please enter both email and password.');
          return;
        }

        // Show the loader
        showLoader();

        // Simulate an asynchronous login request (replace with your actual API call)
        setTimeout(function() {
          hideLoader();
          // After successful login, redirect to the home page
          window.location.href = 'newhome.html'; // Replace 'home.html' with your actual home page URL
        }, 2000); // Simulate a 2-second loading time
      });
    }

    if (registerForm) {
      registerForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent the default form submission

        // Basic client-side validation (you should also have server-side validation)
        const regName = document.getElementById('regName').value;
        const regEmail = document.getElementById('regEmail').value;
        const phone = document.getElementById('phone').value;
        const regPassword = document.getElementById('regPassword').value;
        const gender = document.querySelector('input[name="gender"]:checked');

        if (!regName || !regEmail || !phone || !regPassword || !gender) {
          alert('Please fill in all the registration details.');
          return;
        }

        // Show the loader
        showLoader();

        // Simulate an asynchronous registration request (replace with your actual API call)
        setTimeout(function() {
          hideLoader();
          alert('Registration successful! You can now sign in.');
          registerForm.classList.add('hidden');
          loginForm.classList.remove('hidden');
          // Optionally, you can redirect to the login page directly here
          // window.location.href = 'login.html';
        }, 2000); // Simulate a 2-second loading time
      });
    }

    // Optional: Add a visual feedback when the "Sign In" button is clicked
    if (loginButton) {
      loginButton.addEventListener('click', function() {
        loginButton.classList.add('move-button');
        setTimeout(function() {
          loginButton.classList.remove('move-button');
        }, 300); // Adjust the timeout to match the animation duration
      });
    }
  });
</script>
